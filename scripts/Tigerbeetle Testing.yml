opencollection: 1.0.0
info:
  name: Tigerbeetle Testing
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
  environments:
    - name: Base Environment
      variables:
        - name: api_home
          value: http://localhost:5173
    - name: Local
      variables:
        - name: api_home
          value: http://localhost:5173
    - name: Production
      variables:
        - name: api_home
          value: https://twotone.app
items:
  - info:
      name: Hello World
      type: http
      seq: 2
    http:
      method: GET
      url: http://localhost:8080/test/hello
      headers:
        - name: User-Agent
          value: Insomnia/2023.5.6
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Push Event
      type: http
      seq: 1
    http:
      method: POST
      url: http://localhost:8080/test
      headers:
        - name: Content-Type
          value: application/json
        - name: User-Agent
          value: Insomnia/2023.5.6
      body:
        type: json
        data: |-
          {
            "header": {
              "title": "testiiiing",
              "author": "Samuel Adetunji",
              "timestamp": {{$timestamp}}
            },
            "body": {
              "content": "{{$guid}}"
            }
          }
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Admin
      type: folder
      seq: 3
    request:
      auth: inherit
    items:
      - info:
          name: Fetch Accounts
          type: http
          seq: 1
        http:
          method: GET
          url: http://localhost:8080/admin/account
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-08-24T13:22:48.613Z'
    exportedUsing: Bruno
